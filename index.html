<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro de Incidencias</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado">
    <h1>Sistema de Registro de Incidencias</h1>
    <p class="version">Versión <span id="version-app">1.0.0</span></p>
  </header>

  <main class="contenedor">
    <!-- Formulario de registro -->
    <section class="tarjeta">
      <h2>Registrar incidencia</h2>
      <form id="form-incidencia" novalidate>
        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Ej.: No carga la página de inicio" required>
        </div>

        <div class="campo">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="3" placeholder="Describe el problema" required></textarea>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="reportado-por">Reportado por</label>
            <input type="text" id="reportado-por" placeholder="Nombre del usuario" required>
          </div>

          <div class="campo">
            <label for="prioridad">Prioridad</label>
            <select id="prioridad">
              <option value="Baja">Baja</option>
              <option value="Media" selected>Media</option>
              <option value="Alta">Alta</option>
            </select>
          </div>

          <div class="campo">
            <label for="estado">Estado</label>
            <select id="estado">
              <option value="Abierta" selected>Abierta</option>
              <option value="En proceso">En proceso</option>
              <option value="Cerrada">Cerrada</option>
            </select>
          </div>
        </div>

        <p id="mensaje" class="mensaje" role="alert"></p>
        <button type="submit" class="boton">Registrar</button>
      </form>
    </section>

    <!-- Listado de incidencias -->
    <section class="tarjeta">
      <h2>Incidencias registradas (<span id="contador">0</span>)</h2>
      <div id="lista-incidencias" class="lista"></div>
    </section>
  </main>

  <footer class="pie">
    <p>Gestión de la Configuración del Software — UNEMI</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
