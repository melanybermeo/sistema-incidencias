<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Incidencias</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado">
    <h1>Registro de Incidencias</h1>
    <p>Reporta y da seguimiento a las incidencias del equipo.</p>
  </header>

  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Nueva incidencia</h2>

      <form id="form-incidencia">
        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" name="titulo" maxlength="80"
                 placeholder="Ej.: La página de inicio no carga">
        </div>

        <div class="campo">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="4"
                    placeholder="Describe qué ocurrió y cómo reproducirlo"></textarea>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="prioridad">Prioridad</label>
            <select id="prioridad" name="prioridad">
              <option value="Baja">Baja</option>
              <option value="Media" selected>Media</option>
              <option value="Alta">Alta</option>
            </select>
          </div>

          <div class="campo">
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
              <option value="Abierta" selected>Abierta</option>
              <option value="En proceso">En proceso</option>
              <option value="Resuelta">Resuelta</option>
            </select>
          </div>
        </div>

        <button type="submit" class="boton">Registrar incidencia</button>
        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="pie">
    <p>Registro de Incidencias · Proyecto académico de SCM y despliegue continuo</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
